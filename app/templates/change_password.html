{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Change password</h1>
    <p class="page-subtitle">Changing it signs you out everywhere else.</p>
  </div>
</div>

<div class="card" style="max-width:420px;">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if message %}<div class="message">{{ message }}</div>{% endif %}
  <form method="post" action="/account/password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="256" autocomplete="new-password">
    <p class="muted field-hint">{{ password_rules }}</p>
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="256" autocomplete="new-password">
    <button type="submit" class="btn">Change password</button>
  </form>
</div>
{% endblock %}
